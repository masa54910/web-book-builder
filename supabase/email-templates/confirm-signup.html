<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebBookMaker メール確認</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f3ea;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#1f2f29;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f3ea;padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border-radius:18px;border:1px solid #e7e3d9;overflow:hidden;">
            <tr>
              <td style="padding:24px 26px 10px;">
                <div style="font-size:30px;line-height:1.1;font-weight:900;color:#173f36;letter-spacing:-0.02em;">📚 WebBookMaker</div>
                <div style="margin-top:8px;color:#50615a;font-size:14px;line-height:1.8;">
                  あなたの文章を、<br />
                  そのままWeb書籍に。
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 26px 20px;">
                <div style="height:1px;background:#e8ece8;"></div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 26px 8px;font-size:15px;line-height:1.9;color:#2f3e39;">
                こんにちは。<br /><br />
                WebBookMakerへのご登録ありがとうございます。<br />
                下のボタンを押してメールアドレスを確認してください。
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:18px 26px 10px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:linear-gradient(135deg,#1b8a73,#0f6f5d);color:#ffffff;text-decoration:none;font-weight:800;border-radius:999px;padding:12px 24px;font-size:14px;line-height:1;">メールアドレスを確認する</a>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 26px 16px;font-size:14px;line-height:1.9;color:#4f5f59;">
                確認後はすぐに<br />
                ・作品作成<br />
                ・公開<br />
                ・作者ページ<br />
                をご利用いただけます。
              </td>
            </tr>
            <tr>
              <td style="padding:0 26px 18px;">
                <div style="height:1px;background:#e8ece8;"></div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 26px 8px;font-size:12px;line-height:1.9;color:#687771;">
                このメールに心当たりがない場合はそのまま破棄してください。
              </td>
            </tr>
            <tr>
              <td style="padding:0 26px 24px;font-size:12px;line-height:1.8;color:#7b8882;">© WebBookMaker</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
